<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Suupaa スーパー</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6E7B4;--card:#FFFBEA;--ink:#2B2118;--mut:#7a6a55;--red:#D6402B;--grn:#2F7D4F;--ylw:#F2B632;--line:#e3d29a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a14;--card:#2a251b;--ink:#f6e7b4;--mut:#b9a982;--line:#463d28}}
:root[data-theme="dark"]{--bg:#1d1a14;--card:#2a251b;--ink:#f6e7b4;--mut:#b9a982;--line:#463d28}
html,body{height:100%;margin:0}*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;font-size:var(--fs,16px);display:flex;flex-direction:column;overflow:hidden}
.awn{height:26px;flex:none;background:repeating-linear-gradient(90deg,var(--red) 0 28px,#fff7dc 28px 56px);position:relative;margin-bottom:10px}
.awn:after{content:"";position:absolute;left:0;right:0;top:100%;height:10px;background:radial-gradient(circle at 14px 0,var(--red) 13px,transparent 14px) 0 0/56px 10px,radial-gradient(circle at 42px 0,#fff7dc 13px,transparent 14px) 0 0/56px 10px}
.bar{display:flex;gap:8px;padding:6px 14px 8px;font-size:.78em;color:var(--mut);align-items:center;flex-wrap:wrap}
.bar b{color:var(--ink)}.header-market{border:0;background:transparent;color:var(--ink);font:inherit;padding:0;text-decoration:underline;text-underline-offset:3px}.bar input{font:inherit;font-size:1em;border:0;background:transparent;color:var(--mut);width:118px}
.track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.track::-webkit-scrollbar{display:none}
section{flex:none;width:100%;scroll-snap-align:center;overflow-y:auto;padding:6px 16px 20px;transition:transform .3s,opacity .3s}
section.off{transform:scale(.93);opacity:.55}
h1{font-size:1.7em;line-height:1.1;margin:4px 0 6px}h2{font-size:1.15em;margin:16px 0 8px}
.c{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin:10px 0}
input,select,button{font:inherit;color:var(--ink)}
.f{width:100%;padding:9px 11px;border:2px solid var(--line);border-radius:12px;background:var(--card);margin:3px 0}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{background:var(--red);color:#fff;border:0;border-radius:14px;padding:11px 14px;font-weight:600;cursor:pointer;width:100%;margin-top:6px}
.btn.g{background:var(--grn)}.btn.o{background:transparent;color:var(--ink);border:2px solid var(--line)}
.li{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px dashed var(--line);transition:all .35s}
.li.gone{opacity:0;transform:translateX(40px);height:0;padding:0;overflow:hidden}
.li input{width:22px;height:22px;accent-color:var(--grn)}.li span{flex:1}.li small,.mut{color:var(--mut)}
.stat{background:var(--ylw);color:#2B2118;border-radius:14px;padding:10px 12px;margin-top:10px;cursor:pointer;font-size:.9em}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0}.chip{flex:none;padding:6px 12px;border-radius:99px;border:2px solid var(--line);background:var(--card);cursor:pointer}.chip.on{background:var(--grn);color:#fff;border-color:var(--grn)}
nav{flex:none;display:flex;justify-content:space-around;background:var(--card);border-top:3px solid var(--line);padding:6px 4px 8px}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;font-size:.72em;color:var(--mut);cursor:pointer;gap:2px;padding:4px 10px;border-radius:12px}
nav button i{font-style:normal;font-size:1.7em}nav button.on{color:var(--ink);background:var(--ylw)}
.mod{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9;padding:20px}.mod.on{display:flex}
.mod div{background:var(--card);border-radius:20px;padding:16px;width:100%;max-width:420px}
.th{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none;background:var(--line);display:flex;align-items:center;justify-content:center}
#ph{width:64px;height:64px;object-fit:cover;margin:3px 0}.list-box summary{cursor:pointer;font-weight:600;padding:2px}.list-box summary small{font-weight:400;color:var(--mut)}.list-box[open] summary{margin-bottom:8px}
.tot{font-size:1.6em;font-weight:600;color:var(--red)}
</style></head><body>
<div class="awn"></div>
<div class="bar"><span>📅 <input type="date" id="dt"></span><span>🏪 <button id="mk" class="header-market" type="button" onclick="go(0)">Escolha o mercado</button></span></div>
<div class="track" id="tr">
<section id="p0"></section><section id="p1"></section><section id="p2"></section><section id="p3"></section>
</div>
<nav id="nv"></nav>
<div class="mod" id="md"><div id="mb"></div></div>
<script>
const $=s=>document.querySelector(s),R=v=>"R$ "+(+v||0).toFixed(2).replace(".",","),T=new Date().toISOString().slice(0,10);
let S={user:"",market:"",city:"",markets:[],customShelves:[],customUnits:[],theme:"auto",fs:16,hist:[],list:[],cart:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem("suupaa")||"{}"))}catch(e){}
S.markets=Array.isArray(S.markets)?S.markets:[];S.customShelves=Array.isArray(S.customShelves)?S.customShelves:[];S.customUnits=Array.isArray(S.customUnits)?S.customUnits:[];S.hist=Array.isArray(S.hist)?S.hist:[];S.list=Array.isArray(S.list)?S.list:[];S.cart=Array.isArray(S.cart)?S.cart:[];
if(S.market&&!S.markets.some(m=>m.name===S.market&&m.city===(S.city||"")))S.markets.push({name:S.market,city:S.city||""});
const save=()=>{try{localStorage.setItem("suupaa",JSON.stringify(S))}catch(e){}};
let date=T,F={shelf:"Todos",mk:"",q:"",mo:""},cur={};
const SH=["Hortifruti","Frios","Padaria","Açougue","Congelados","Geladeira","Limpeza","Higiene","Bebidas","Snacks","Grãos e farinhas","Outros"];
const shelves=()=>[...SH,...S.customShelves.filter(x=>!SH.includes(x))];
const units=()=>["g","kg","ml","L","un","rolo","m","folha",...S.customUnits.filter(x=>!["g","kg","ml","L","un","rolo","m","folha"].includes(x))];
const clean=s=>s.replace(/[^A-Za-z0-9]/g,"").slice(0,20);
const prods=()=>{const m={};S.hist.forEach(h=>m[h.code]=h);return Object.values(m)};
const find=(code,name)=>S.hist.filter(h=>code?h.code===code:name&&h.name.toLowerCase()===name.toLowerCase());
const last=t=>{const l=S.hist.filter(h=>h.name.toLowerCase().includes(t.toLowerCase()));return l.length?l[l.length-1]:null};
function updateHeader(){$("#mk").textContent=S.market?S.market+(S.city?" · "+S.city:""):"Escolha o mercado";$("#dt").value=date;
document.documentElement.dataset.theme=S.theme;document.documentElement.style.setProperty("--fs",S.fs+"px")}
$("#dt").onchange=e=>{date=e.target.value||T};
const long=new Date().toLocaleDateString("pt-BR",{day:"numeric",month:"long",year:"numeric"});
function marketOptions(){return S.markets.map((m,i)=>`<option value="${i}" ${m.name===S.market&&m.city===(S.city||"")?"selected":""}>${m.name}${m.city?" · "+m.city:""}</option>`).join("")}
function chooseMarket(i){const m=S.markets[+i];if(!m)return;S.market=m.name;S.city=m.city||"";save();updateHeader();p0()}
function addMarket(){const name=$("#newMarket").value.trim(),city=$("#newCity").value.trim();if(!name){alert("Informe o nome do mercado.");return}let m=S.markets.find(x=>x.name.toLowerCase()===name.toLowerCase()&&(x.city||"").toLowerCase()===city.toLowerCase());if(!m){m={name,city};S.markets.push(m)}S.market=m.name;S.city=m.city;save();updateHeader();p0()}
function listMarkup(where){const pending=S.list.filter(i=>!i.done);return `<details class="c list-box"><summary>🧺 Lista de compras <small>(${pending.length} ${pending.length===1?"item":"itens"})</small></summary><div id="ls-${where}">${S.list.map((i,n)=>`<div class="li ${i.done?"gone":""}"><input type="checkbox" ${i.done?"checked":""} onchange="tick(${n},this)"><span>${i.t}</span><small>${last(i.t)?R(last(i.t).price):""}</small></div>`).join("")||'<div class="mut">Lista vazia. Adicione o primeiro item.</div>'}</div><div class="row"><input class="f" id="ni-${where}" placeholder="Novo item"><button class="btn" style="flex:none;width:auto" onclick="addL('${where}')">+</button></div></details>`}
function p0(){const h=new Date().getHours(),g=h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";
$("#p0").innerHTML=`<h1>${g}, ${S.user||"feirante"}!</h1><div class="mut">Hoje é dia ${long}.</div>
<div class="c"><b>Em que mercado você está?</b>
<select class="f" id="marketSelect" onchange="chooseMarket(this.value)"><option value="">Selecione um mercado cadastrado</option>${marketOptions()}</select>
<button class="btn o" type="button" onclick="document.getElementById('marketAdd').hidden=false">+ Cadastrar novo mercado</button>
<div id="marketAdd" hidden><input class="f" id="newMarket" placeholder="Nome do mercado"><input class="f" id="newCity" placeholder="Cidade"><button class="btn g" type="button" onclick="addMarket()">Salvar mercado</button></div>
</div>${listMarkup("home")}`}
function tick(n,el){S.list[n].done=true;el.parentNode.classList.add("gone");setTimeout(()=>{S.list=S.list.filter(i=>!i.done);save();p0();p2()},380);save()}
function addL(where){const v=$("#ni-"+where).value.trim();if(v){S.list.push({t:v,done:false});save();p0();p2()}}
function p1(){$("#p1").innerHTML=`<h1>Registrar produto</h1>
<div class="row"><input class="f" id="cd" placeholder="Código (barras ou seu)" oninput="this.value=clean(this.value);lk()"><button class="btn o" style="flex:none;width:auto" onclick="scan()">📷</button></div>
<div class="row" style="align-items:center"><label class="btn o" style="flex:none;width:auto;margin:3px 0">📸 Foto do produto<input type="file" accept="image/*" capture="environment" hidden onchange="foto(this)"></label><img id="ph" class="th" style="display:none"></div>
<div id="scannerBox" hidden><video id="vd" style="display:block;width:100%;max-height:230px;object-fit:cover;border-radius:14px" playsinline muted></video><button class="btn o" type="button" onclick="stopScan()">Parar leitura</button></div>
<input class="f" id="nm" placeholder="Item (ex.: Molho de tomate)" oninput="lk()">
<div class="row"><input class="f" id="br" placeholder="Marca"><select class="f" id="sh">${shelves().map(s=>`<option>${s}</option>`).join("")}</select></div><div class="row"><input class="f" id="newShelf" placeholder="Nova prateleira"><button class="btn o" style="flex:none;width:auto" type="button" onclick="addShelf()">+ Prateleira</button></div>
<div class="row"><input class="f" id="qt" oninput="lk()" type="number" placeholder="Qtd (itens)" inputmode="decimal"><select class="f" id="un" onchange="lk()">${units().map(u=>`<option>${u}</option>`).join("")}</select><input class="f" id="pr" oninput="lk()" type="number" step="0.01" placeholder="R$" inputmode="decimal"></div><div class="row"><input class="f" id="newUnit" placeholder="Nova unidade (ex.: pacote)"><button class="btn o" style="flex:none;width:auto" type="button" onclick="addUnit()">+ Unidade</button></div>
<div class="row"><button class="btn" onclick="reg(0)">Salvar</button><button class="btn g" onclick="reg(1)">Salvar + carrinho</button></div>
<div id="st"></div>`}
function addShelf(){const v=$("#newShelf").value.trim();if(!v)return;if(!shelves().some(x=>x.toLowerCase()===v.toLowerCase()))S.customShelves.push(v);save();p1();p3();$("#sh").value=v}
function addUnit(){const v=$("#newUnit").value.trim();if(!v)return;if(!units().some(x=>x.toLowerCase()===v.toLowerCase()))S.customUnits.push(v);save();p1();$("#un").value=v}
let PH="";const im=p=>p?`<img class="th" src="${p}">`:'<div class="th">🧺</div>';
function setPh(d){PH=d||"";const e=$("#ph");e.src=PH;e.style.display=PH?"block":"none"}
function foto(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,200/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);setPh(c.toDataURL("image/jpeg",.6))};i.src=r.result};r.readAsDataURL(f);el.value=""}
const M={g:[1000,"kg"],ml:[1000,"L"]},lab=u=>(M[u]||[1,u])[1],fd=d=>d.split("-").reverse().join("/");
const up=h=>{const q=+h.qty,p=+h.price;if(!q||!p)return null;return{v:p/q*(M[h.unit]||[1])[0],l:lab(h.unit)}},U=o=>R(o.v)+"/"+o.l;
function lk(){const c=$("#cd").value,n=$("#nm").value,l=find(c,n);const o=document.activeElement;
if(l.length&&c&&o.id==="cd"){const x=l[l.length-1];$("#nm").value=x.name;$("#br").value=x.brand;$("#qt").value=x.qty;$("#un").value=x.unit;$("#sh").value=x.shelf;setPh(x.photo)}
cur=l;const s=$("#st"),pv=up({price:+$("#pr").value,qty:$("#qt").value,unit:$("#un").value}),pt=pv?`<div class="stat" style="background:var(--grn);color:#fff;cursor:default">Este produto: <b>${U(pv)}</b></div>`:"",nl=n?S.hist.filter(h=>h.name.toLowerCase()===n.toLowerCase()&&up(h)&&up(h).l===lab($("#un").value)):[],bu=nl.length?nl.reduce((a,b)=>up(b).v<up(a).v?b:a):null,bt=bu?`<div class="stat" style="cursor:default">🥇 Melhor custo: <b>${bu.brand||"?"}</b> a ${U(up(bu))} em ${bu.market||"?"}, ${fd(bu.date)}</div>`:"";if(!l.length){s.innerHTML=pt+bt;return}
const m=l.reduce((a,b)=>b.price<a.price?b:a),mo=l.filter(h=>h.date.slice(0,7)===T.slice(0,7)),av=(mo.length?mo:l).reduce((a,b)=>a+b.price,0)/(mo.length||l.length);
s.innerHTML=pt+bt+`<div class="stat" onclick="chart()">🏷️ Menor: <b>${R(m.price)}</b> em ${m.market||"?"}, ${m.date.split("-").reverse().join("/")}<br>Média ${mo.length?"do mês":"geral"}: <b>${R(av)}</b> · toque para ver o gráfico</div>`}
function reg(c){const v={code:clean($("#cd").value)||("X"+Date.now().toString(36).toUpperCase()),name:$("#nm").value.trim(),brand:$("#br").value.trim(),qty:$("#qt").value,unit:$("#un").value,shelf:$("#sh").value,price:+$("#pr").value,market:S.market,city:S.city,date,photo:PH||(cur.length?cur[cur.length-1].photo:"")};
if(!v.name||!v.price){alert("Preencha item e preço.");return}
S.hist.push(v);if(c)S.cart.push({...v,q:1});save();["cd","nm","br","qt","pr"].forEach(i=>$("#"+i).value="");setPh("");$("#st").innerHTML='<div class="stat">Salvo! ✔</div>';p2();p3();p1()}
function chart(){const l=[...cur].sort((a,b)=>a.date<b.date?-1:1),mx=Math.max(...l.map(h=>h.price)),mn=Math.min(...l.map(h=>h.price)),r=mx-mn||1;
const pts=l.map((h,i)=>[20+i*(260/Math.max(l.length-1,1)),110-((h.price-mn)/r)*90]);
$("#mb").innerHTML=`<b>${l[0].name} · histórico de preços</b><svg viewBox="0 0 300 130" style="width:100%"><polyline fill="none" stroke="var(--red)" stroke-width="3" points="${pts.map(p=>p.join(",")).join(" ")}"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--grn)"/><text x="${p[0]}" y="${p[1]-8}" font-size="9" text-anchor="middle" fill="var(--ink)">${l[i].price.toFixed(2)}</text>`).join("")}</svg><button class="btn o" onclick="md.classList.remove('on')">Fechar</button>`;md.classList.add("on")}
let scanControls=null,scanStream=null;
function stopScan(){try{if(scanControls)scanControls.stop()}catch(e){}try{if(scanStream)scanStream.getTracks().forEach(t=>t.stop())}catch(e){}scanControls=null;scanStream=null;const v=$("#vd");if(v){v.pause();v.srcObject=null}const box=$("#scannerBox");if(box)box.hidden=true}
async function scan(){const box=$("#scannerBox"),v=$("#vd");try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("Câmera indisponível neste navegador.");box.hidden=false;
if(window.BarcodeDetector){try{const supported=await BarcodeDetector.getSupportedFormats();if(supported.includes("ean_13")||supported.includes("ean_8")||supported.includes("upc_a")){scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});v.srcObject=scanStream;await v.play();const detector=new BarcodeDetector({formats:supported.filter(x=>["ean_13","ean_8","upc_a","upc_e","code_128","code_39"].includes(x))});const poll=async()=>{if(!scanStream)return;try{const found=await detector.detect(v);if(found.length){$("#cd").value=clean(found[0].rawValue);stopScan();lk();return}}catch(e){}requestAnimationFrame(poll)};poll();return}}catch(e){stopScan()}}
if(!window.ZXingBrowser){await new Promise((resolve,reject)=>{const sc=document.createElement("script");sc.src="https://unpkg.com/@zxing/browser@0.2.1";sc.onload=resolve;sc.onerror=()=>reject(new Error("Não foi possível carregar o leitor de código de barras."));document.head.appendChild(sc)})}
const Reader=window.ZXingBrowser&&window.ZXingBrowser.BrowserMultiFormatReader;if(!Reader)throw new Error("Leitor de código de barras indisponível. Digite o código manualmente.");const reader=new Reader();scanControls=await reader.decodeFromConstraints({video:{facingMode:{ideal:"environment"}}},v,(result,err,controls)=>{if(result){scanControls=controls;$("#cd").value=clean(result.getText());stopScan();lk()}});
}catch(e){stopScan();alert(e.message||"Não foi possível acessar a câmera. Digite o código manualmente.")}}
function p2(){const t=S.cart.reduce((a,i)=>a+i.price*i.q,0);
$("#p2").innerHTML=`<h1>Carrinho 🛒</h1><div class="c">${S.cart.map((i,n)=>`<div class="li">${im(i.photo)}<span>${i.name} <small>${i.brand} ${i.qty}${i.unit}</small></span><button class="chip" onclick="S.cart[${n}].q=Math.max(1,S.cart[${n}].q-1);save();p2()">−</button><b>${i.q}</b><button class="chip" onclick="S.cart[${n}].q++;save();p2()">+</button><small>${R(i.price*i.q)}</small></div>`).join("")||'<div class="mut">Carrinho vazio. Use “Salvar + carrinho” ao registrar.</div>'}</div>
<div>Total: <span class="tot">${R(t)}</span></div><button class="btn o" onclick="S.cart=[];save();p2()">Esvaziar carrinho</button>${listMarkup("cart")}`}
function p3(){const hs=S.hist.filter(h=>(!F.mk||h.market===F.mk)&&(!F.q||h.name.toLowerCase().includes(F.q.toLowerCase()))&&(!F.mo||h.date.startsWith(F.mo))).reverse();
const pr=prods().filter(p=>F.shelf==="Todos"||p.shelf===F.shelf),mks=[...new Set(S.hist.map(h=>h.market).filter(Boolean))];
$("#p3").innerHTML=`<h1>Minha banca</h1><div class="c"><b>⚙️ Configurações</b>
<input class="f" placeholder="Seu nome" value="${S.user}" onchange="S.user=this.value;save();p0()">
<input class="f" placeholder="Compartilhar com (e-mail)" disabled title="Requer servidor">
<div class="row"><select class="f" onchange="S.theme=this.value;save();updateHeader()"><option value="auto">Tema auto</option><option value="light" ${S.theme=="light"?"selected":""}>Claro</option><option value="dark" ${S.theme=="dark"?"selected":""}>Escuro</option></select>
<select class="f" onchange="S.fs=+this.value;save();updateHeader()">${[14,16,19].map(x=>`<option value="${x}" ${S.fs==x?"selected":""}>Fonte ${x}</option>`).join("")}</select></div></div>
<div class="c"><b>📜 Histórico</b><div class="row"><input class="f" placeholder="Item" value="${F.q}" onchange="F.q=this.value;p3()"><input class="f" type="month" value="${F.mo}" onchange="F.mo=this.value;p3()"></div>
<select class="f" onchange="F.mk=this.value;p3()"><option value="">Todos os mercados</option>${mks.map(m=>`<option ${F.mk==m?"selected":""}>${m}</option>`).join("")}</select>
${hs.slice(0,30).map(h=>`<div class="li">${im(h.photo)}<span>${h.name} <small>${h.brand} ${h.qty}${h.unit}<br>${h.market||"?"} · ${h.date.split("-").reverse().join("/")}</small></span><b>${R(h.price)}${up(h)?`<br><small>${U(up(h))}</small>`:""}</b></div>`).join("")||'<div class="mut">Nenhum registro.</div>'}
<button class="btn g" onclick="csv()">Copiar CSV</button><a class="btn o" style="display:block;text-align:center;text-decoration:none;margin-top:6px" target="_blank" href="https://docs.google.com/spreadsheets/create">Abrir Google Sheets e colar</a></div>
<div class="c"><b>🥕 Meus produtos</b><div class="chips">${["Todos",...shelves()].map(s=>`<span class="chip ${F.shelf==s?"on":""}" onclick="F.shelf='${s}';p3()">${s}</span>`).join("")}</div><div class="row"><input class="f" id="shelfFromBank" placeholder="Nova prateleira"><button class="btn o" style="flex:none;width:auto" onclick="addShelfFromBank()">+ Adicionar</button></div>
${pr.map(p=>`<div class="li">${im(p.photo)}<span>${p.name} <small>${p.brand} ${p.qty}${p.unit}</small></span><small>${p.shelf}</small></div>`).join("")||'<div class="mut">Nada nesta prateleira.</div>'}</div>`}
function addShelfFromBank(){const v=$("#shelfFromBank").value.trim();if(v&&!shelves().some(x=>x.toLowerCase()===v.toLowerCase()))S.customShelves.push(v);save();F.shelf=v||"Todos";p3();p1()}
function csv(){const c="data;mercado;cidade;codigo;item;marca;qtd;unidade;prateleira;preco\n"+S.hist.map(h=>[h.date,h.market,h.city,h.code,h.name,h.brand,h.qty,h.unit,h.shelf,h.price].join(";")).join("\n");
navigator.clipboard.writeText(c).then(()=>alert("CSV copiado! Cole no Google Sheets."),()=>alert("Não foi possível copiar."))}
const tabs=[["🏠","Início"],["📷","Registrar"],["🛒","Carrinho"],["👤","Banca"]];
$("#nv").innerHTML=tabs.map((t,i)=>`<button onclick="go(${i})"><i>${t[0]}</i>${t[1]}</button>`).join("");
const tr=$("#tr");function go(i){tr.scrollTo({left:i*tr.clientWidth,behavior:"smooth"})}
tr.onscroll=()=>{const i=Math.round(tr.scrollLeft/tr.clientWidth);document.querySelectorAll("#nv button").forEach((b,j)=>b.classList.toggle("on",i==j));document.querySelectorAll("section").forEach((s,j)=>s.classList.toggle("off",i!=j))};
updateHeader();p0();p1();p2();p3();tr.onscroll();
</script></body></html>
