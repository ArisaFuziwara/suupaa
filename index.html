<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Suupaa スーパー</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6E7B4;--card:#FFFBEA;--ink:#2B2118;--mut:#7a6a55;--red:#D6402B;--grn:#2F7D4F;--ylw:#F2B632;--line:#e3d29a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a14;--card:#2a251b;--ink:#f6e7b4;--mut:#b9a982;--line:#463d28}}
:root[data-theme="dark"]{--bg:#1d1a14;--card:#2a251b;--ink:#f6e7b4;--mut:#b9a982;--line:#463d28}
html,body{height:100%;margin:0}*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;font-size:var(--fs,16px);display:flex;flex-direction:column;overflow:hidden}
.awn{height:26px;flex:none;background:repeating-linear-gradient(90deg,var(--red) 0 28px,#fff7dc 28px 56px);position:relative;margin-bottom:10px}
.awn:after{content:"";position:absolute;left:0;right:0;top:100%;height:10px;background:radial-gradient(circle at 14px 0,var(--red) 13px,transparent 14px) 0 0/56px 10px,radial-gradient(circle at 42px 0,#fff7dc 13px,transparent 14px) 0 0/56px 10px}
.bar{display:flex;gap:8px;padding:6px 14px 8px;font-size:.78em;color:var(--mut);align-items:center;flex-wrap:wrap}
.bar b{color:var(--ink)}.header-market{border:0;background:transparent;color:var(--ink);font:inherit;padding:0;text-decoration:underline;text-underline-offset:3px}.bar input{font:inherit;font-size:1em;border:0;background:transparent;color:var(--mut);width:118px}
.track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.track::-webkit-scrollbar{display:none}
section{flex:none;width:100%;scroll-snap-align:center;overflow-y:auto;padding:6px 16px 20px;transition:transform .3s,opacity .3s}
section.off{transform:scale(.93);opacity:.55}
h1{font-size:1.7em;line-height:1.1;margin:4px 0 6px}h2{font-size:1.15em;margin:16px 0 8px}
.c{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin:10px 0}
input,select,button{font:inherit;color:var(--ink)}
.f{width:100%;min-width:0;max-width:100%;padding:9px 11px;border:2px solid var(--line);border-radius:12px;background:var(--card);margin:3px 0}
#regDate{display:block;width:100%;min-width:0;max-width:100%;appearance:auto} .c{min-width:0;max-width:100%}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{background:var(--red);color:#fff;border:0;border-radius:14px;padding:11px 14px;font-weight:600;cursor:pointer;width:100%;margin-top:6px}
.btn.g{background:var(--grn)}.btn.o{background:transparent;color:var(--ink);border:2px solid var(--line)}
.li{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px dashed var(--line);transition:all .35s}
.li.gone{opacity:0;transform:translateX(40px);height:0;padding:0;overflow:hidden}
.li input{width:22px;height:22px;accent-color:var(--grn)}.li span{flex:1}.li small,.mut{color:var(--mut)}
.stat{background:var(--ylw);color:#2B2118;border-radius:14px;padding:10px 12px;margin-top:10px;cursor:pointer;font-size:.9em}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0}.chip{flex:none;padding:6px 12px;border-radius:99px;border:2px solid var(--line);background:var(--card);cursor:pointer}.chip.on{background:var(--grn);color:#fff;border-color:var(--grn)}
nav{flex:none;display:flex;justify-content:space-around;background:var(--card);border-top:3px solid var(--line);padding:6px 4px 8px}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;font-size:.65em;color:var(--mut);cursor:pointer;gap:2px;padding:4px 5px;border-radius:12px;min-width:0}
nav button i{font-style:normal;font-size:1.55em}nav button.on{color:var(--ink);background:var(--ylw)}
.mod{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9;padding:20px}.mod.on{display:flex}
.mod div{background:var(--card);border-radius:20px;padding:16px;width:100%;max-width:420px}
.th{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none;background:var(--line);display:flex;align-items:center;justify-content:center}
#ph{width:64px;height:64px;object-fit:cover;margin:3px 0}.list-box summary{cursor:pointer;font-weight:600;padding:2px}.list-box summary small{font-weight:400;color:var(--mut)}.list-box[open] summary{margin-bottom:8px}
.tot{font-size:1.6em;font-weight:600;color:var(--red)}
@media(max-width:390px){nav button{padding:4px 2px;font-size:.59em}nav button i{font-size:1.4em}}
</style></head><body>
<div class="awn"></div>
<div class="bar"><span>📅 <input type="date" id="dt"></span><span>🏪 <select id="headerMarket" class="header-market" onchange="headerMarketChange(this.value)"></select></span></div>
<div class="track" id="tr">
<section id="p0"></section><section id="p1"></section><section id="p4"></section><section id="p2"></section><section id="p5"></section><section id="p3"></section>
</div>
<nav id="nv"></nav>
<div class="mod" id="md"><div id="mb"></div></div>
<script>
const $=s=>document.querySelector(s),R=v=>"R$ "+(+v||0).toFixed(2).replace(".",","),T=(()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")})();
let S={user:"",market:"",city:"",markets:[],customShelves:[],customUnits:[],theme:"auto",fs:16,hist:[],list:[],cart:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem("suupaa")||"{}"))}catch(e){}
S.markets=Array.isArray(S.markets)?S.markets:[];S.customShelves=Array.isArray(S.customShelves)?S.customShelves:[];S.customUnits=Array.isArray(S.customUnits)?S.customUnits:[];S.hist=Array.isArray(S.hist)?S.hist:[];S.list=Array.isArray(S.list)?S.list:[];S.cart=Array.isArray(S.cart)?S.cart:[];
S.products=Array.isArray(S.products)?S.products:[];
// Migração local: cada produto antigo do histórico passa a compor o catálogo, sem apagar registros.
for(let i=0;i<S.hist.length;i++){const h=S.hist[i],code=String(h.code||"").replace(/[^A-Za-z0-9]/g,"").slice(0,20)||("LEG"+i);if(!S.products.some(p=>p.code===code)){S.products.push({code,name:h.name||"",brand:h.brand||"",qty:h.qty||"",unit:h.unit||"un",shelf:h.shelf||"Outros",photo:h.photo||""})}}
if(S.market&&!S.markets.some(m=>m.name===S.market&&m.city===(S.city||"")))S.markets.push({name:S.market,city:S.city||""});
let storageWarningShown=false;
const save=()=>{try{localStorage.setItem("suupaa",JSON.stringify(S));return true}catch(e){if(!storageWarningShown){storageWarningShown=true;alert("Não foi possível salvar os dados neste navegador. O armazenamento pode estar cheio (principalmente por causa das fotos). Faça um backup em Eu > Backup dos dados e reduza/remova fotos grandes.")}return false}};
let date=T,regDate=T,regMarket=(S.market||"")+"|"+(S.city||""),F={shelf:"Todos",mk:"",q:"",mo:""},cur={};
const SH=["Hortifruti","Frios","Padaria","Açougue","Congelados","Geladeira","Limpeza","Higiene","Bebidas","Snacks","Grãos e farinhas","Outros"];
const shelves=()=>[...SH,...S.customShelves.filter(x=>!SH.includes(x))];
const units=()=>["g","kg","ml","L","un","rolo","m","folha",...S.customUnits.filter(x=>!["g","kg","ml","L","un","rolo","m","folha"].includes(x))];
const clean=s=>s.replace(/[^A-Za-z0-9]/g,"").slice(0,20);
const prods=()=>{const m={};S.hist.forEach(h=>m[h.code]=h);return Object.values(m)};
const find=(code,name)=>S.hist.filter(h=>code?h.code===code:name&&h.name.toLowerCase()===name.toLowerCase());
const last=t=>{const l=S.hist.filter(h=>h.name.toLowerCase().includes(t.toLowerCase()));return l.length?l[l.length-1]:null};
function updateHeader(){
const sel=$("#headerMarket");if(sel){sel.innerHTML=`<option value="">Escolha o mercado</option>${marketOptions()}<option value="__new__">＋ Novo</option>`;const ix=S.markets.findIndex(m=>m.name===S.market&&m.city===(S.city||""));sel.value=ix>=0?String(ix):""}
$("#dt").value=date;document.documentElement.dataset.theme=S.theme;document.documentElement.style.setProperty("--fs",S.fs+"px")}
function headerMarketChange(v){if(v==="__new__"){const name=prompt("Nome do mercado:");if(!name){updateHeader();return}const city=prompt("Cidade:")||"";const old=S.markets.find(m=>m.name.toLowerCase()===name.trim().toLowerCase()&&(m.city||"").toLowerCase()===city.trim().toLowerCase());if(!old)S.markets.push({name:name.trim(),city:city.trim()});S.market=name.trim();S.city=city.trim()}else if(v!==""){const m=S.markets[+v];if(m){S.market=m.name;S.city=m.city||""}}else{S.market="";S.city=""}regMarket=S.market+"|"+(S.city||"");save();updateHeader();p0();const r=$("#regMarket");if(r){r.innerHTML=`<option value="">Selecione o mercado</option>${marketOptions()}<option value="__new__">＋ Novo</option>`;const ix=S.markets.findIndex(m=>m.name+"|"+(m.city||"")===regMarket);r.value=ix>=0?String(ix):""}}
$("#dt").onchange=e=>{date=e.target.value||T;regDate=date;const d=$("#regDate");if(d)d.value=regDate};
const long=new Date().toLocaleDateString("pt-BR",{day:"numeric",month:"long",year:"numeric"});
function marketOptions(){return S.markets.map((m,i)=>`<option value="${i}" ${m.name===S.market&&m.city===(S.city||"")?"selected":""}>${m.name}${m.city?" · "+m.city:""}</option>`).join("")}
function chooseMarket(i){const m=S.markets[+i];if(!m)return;S.market=m.name;S.city=m.city||"";save();updateHeader();p0()}
function addMarket(){const name=$("#newMarket").value.trim(),city=$("#newCity").value.trim();if(!name){alert("Informe o nome do mercado.");return}let m=S.markets.find(x=>x.name.toLowerCase()===name.toLowerCase()&&(x.city||"").toLowerCase()===city.toLowerCase());if(!m){m={name,city};S.markets.push(m)}S.market=m.name;S.city=m.city;regMarket=m.name+"|"+(m.city||"");save();updateHeader();p0();p1()}
function listMarkup(where){const pending=S.list.filter(i=>!i.done);return `<details class="c list-box"><summary>🧺 Lista de compras <small>(${pending.length} ${pending.length===1?"item":"itens"})</small></summary><div id="ls-${where}">${S.list.map((i,n)=>`<div class="li ${i.done?"gone":""}"><input type="checkbox" ${i.done?"checked":""} onchange="tick(${n},this)"><span>${i.t}</span><small>${last(i.t)?R(last(i.t).price):""}</small></div>`).join("")||'<div class="mut">Lista vazia. Adicione o primeiro item.</div>'}</div><div class="row"><input class="f" id="ni-${where}" placeholder="Novo item"><button class="btn" style="flex:none;width:auto" onclick="addL('${where}')">+</button></div></details>`}
function p0(){const h=new Date().getHours(),g=h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";
$("#p0").innerHTML=`<h1>${g}, ${S.user||"feirante"}!</h1><div class="mut">Hoje é dia ${long}.</div>
<div class="c"><b>Em que mercado você está?</b>
<select class="f" id="marketSelect" onchange="chooseMarket(this.value)"><option value="">Selecione um mercado cadastrado</option>${marketOptions()}</select>
<button class="btn o" type="button" onclick="document.getElementById('marketAdd').hidden=false">+ Cadastrar novo mercado</button>
<div id="marketAdd" hidden><input class="f" id="newMarket" placeholder="Nome do mercado"><input class="f" id="newCity" placeholder="Cidade"><button class="btn g" type="button" onclick="addMarket()">Salvar mercado</button></div>
</div>${listMarkup("home")}`}
function tick(n,el){S.list[n].done=true;el.parentNode.classList.add("gone");setTimeout(()=>{S.list=S.list.filter(i=>!i.done);save();p0();p2()},380);save()}
function addL(where){const v=$("#ni-"+where).value.trim();if(v){S.list.push({t:v,done:false});save();p0();p2()}}
function productByCode(code){return S.products.find(p=>String(p.code||"")===String(clean(code)))}
function productNameMatches(q){q=(q||"").trim().toLowerCase();return S.products.filter(p=>!q||p.name.toLowerCase().includes(q)||String(p.code).includes(q)||String(p.brand||"").toLowerCase().includes(q))}
function p1(){
 const opts=S.products.slice().sort((a,b)=>a.name.localeCompare(b.name,"pt-BR"));
 $("#p1").innerHTML=`<h1>Registrar preço</h1>
 <div class="c"><b>1. Encontre o produto</b>
 <div class="row"><input class="f" id="regSearch" placeholder="Código de barras ou nome do produto" oninput="searchRegProducts()"><button class="btn o" style="flex:none;width:auto" onclick="scan()">📷 Ler</button></div>
 <div id="regResults" class="mut">Digite o nome ou código, ou use a câmera. Cadastre o produto na aba Produtos se ainda não existir.</div>
 <div id="selectedProduct"></div></div>
 <div class="c"><b>2. Dados da pesquisa</b><label class="mut" for="regPrice">Preço encontrado</label><input class="f" id="regPrice" type="number" step="0.01" min="0.01" placeholder="R$ 0,00" inputmode="decimal">
 <label class="mut" for="regDate">Data</label><input class="f" id="regDate" type="date" value="${regDate}" onchange="regDate=this.value">
 <label class="mut" for="regMarket">Mercado</label><select class="f" id="regMarket" onchange="setRegMarket(this.value)"><option value="">Selecione o mercado</option>${marketOptions()}<option value="__new__">＋ Novo</option></select>
 <label class="btn o" style="display:block;text-align:center;cursor:pointer">📸 Foto da etiqueta (opcional)<input type="file" accept="image/*" capture="environment" hidden onchange="fotoRegistro(this)"></label><img id="pricePhoto" class="th" style="display:none;width:76px;height:76px">
 <button class="btn g" onclick="savePrice(0)">Salvar preço</button><button class="btn" onclick="savePrice(1)">Salvar preço + carrinho</button><div id="regStatus"></div></div>
 <div class="mut">O cadastro do produto é permanente. Cada pesquisa cria apenas um novo registro de preço.</div>
 <div id="scannerBox" hidden><video id="vd" style="display:block;width:100%;max-height:230px;object-fit:cover;border-radius:14px" playsinline muted></video><button class="btn o" type="button" onclick="stopScan()">Parar leitura</button></div>`;
 const rm=$("#regMarket");if(rm){const ix=S.markets.findIndex(m=>m.name+"|"+(m.city||"")===regMarket);rm.value=ix>=0?String(ix):""}
 if(regSelectedCode)selectProduct(regSelectedCode);
}
let regSelectedCode="",pricePhoto="";
function searchRegProducts(){const q=$("#regSearch").value;const found=productNameMatches(q).slice(0,12);$("#regResults").innerHTML=found.map(p=>`<div class="li" onclick="selectProduct('${String(p.code).replace(/'/g,"\\'")}')" style="cursor:pointer">${im(p.photo)}<span><b>${p.name}</b><small>${p.brand||""} · ${p.shelf||""} · ${p.qty||""}${p.unit||""}</small></span><small>Selecionar ›</small></div>`).join("")||'<div class="mut">Nenhum produto encontrado. Cadastre-o na aba Produtos.</div>'}
function selectProduct(code){const p=productByCode(code);if(!p){regSelectedCode="";return}regSelectedCode=p.code;$("#selectedProduct").innerHTML=`<div class="li">${im(p.photo)}<span><b>${p.name}</b><small>${p.brand||""} · ${p.qty||""}${p.unit||""} · ${p.shelf||""}</small></span><button class="chip" onclick="clearSelectedProduct()">Trocar</button></div>`;$("#regResults").innerHTML="Produto selecionado."}
function clearSelectedProduct(){regSelectedCode="";$("#selectedProduct").innerHTML="";searchRegProducts()}
function setRegMarket(v){if(v==="__new__"){const name=prompt("Nome do mercado:");if(!name){p1();return}const city=prompt("Cidade:")||"";let m=S.markets.find(x=>x.name.toLowerCase()===name.trim().toLowerCase()&&(x.city||"").toLowerCase()===city.trim().toLowerCase());if(!m){m={name:name.trim(),city:city.trim()};S.markets.push(m)}regMarket=m.name+"|"+(m.city||"");}else{const m=S.markets[+v];regMarket=m?m.name+"|"+(m.city||""):""}save();updateHeader();const sel=$("#regMarket");if(sel){sel.innerHTML=`<option value="">Selecione o mercado</option>${marketOptions()}<option value="__new__">＋ Novo</option>`;const ix=S.markets.findIndex(m=>m.name+"|"+(m.city||"")===regMarket);sel.value=ix>=0?String(ix):""}}
function fotoRegistro(el){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const sc=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*sc;c.height=i.height*sc;c.getContext("2d").drawImage(i,0,0,c.width,c.height);pricePhoto=c.toDataURL("image/jpeg",.72);const img=$("#pricePhoto");img.src=pricePhoto;img.style.display="block"};i.src=r.result};r.readAsDataURL(f);el.value=""}
function savePrice(addCart){const p=productByCode(regSelectedCode),price=Number($("#regPrice").value);if(!p){alert("Selecione um produto cadastrado antes de salvar o preço.");return}if(!(price>0)){alert("Informe um preço válido.");return}if(!regDate){alert("Informe a data da pesquisa.");return}const mk=regMarket.split("|");const v={code:p.code,name:p.name,brand:p.brand,qty:p.qty,unit:p.unit,shelf:p.shelf,price,market:mk[0]||"",city:mk.slice(1).join("|"),date:regDate,photo:p.photo||"",pricePhoto};S.hist.push(v);if(addCart)S.cart.push({...v,q:1});save();$("#regPrice").value="";pricePhoto="";const img=$("#pricePhoto");img.style.display="none";img.removeAttribute("src");$("#regStatus").innerHTML='<div class="stat">Preço salvo com sucesso!</div>';p2();p3();p5()}
function productForm(code=""){const p=code?productByCode(code):null;$("#mb").innerHTML=`<h2>${p?"Editar produto":"Cadastrar produto"}</h2><label class="mut">Código de barras (opcional)</label><input class="f" id="prodCode" value="${p?.code||""}" placeholder="Código de barras"><label class="mut">Nome</label><input class="f" id="prodName" value="${p?.name||""}" placeholder="Nome do produto"><label class="mut">Marca</label><input class="f" id="prodBrand" value="${p?.brand||""}" placeholder="Marca"><div class="row"><div><label class="mut">Quantidade</label><input class="f" id="prodQty" value="${p?.qty||""}" placeholder="Ex.: 500"></div><div><label class="mut">Unidade</label><select class="f" id="prodUnit">${units().map(u=>`<option ${u===(p?.unit||"un")?"selected":""}>${u}</option>`).join("")}<option value="__new__">＋ Nova</option></select></div></div><label class="mut">Prateleira</label><select class="f" id="prodShelf">${shelves().map(x=>`<option ${x===(p?.shelf||"Outros")?"selected":""}>${x}</option>`).join("")}<option value="__new__">＋ Nova</option></select><label class="btn o" style="display:block;text-align:center">📸 Foto do produto<input id="prodPhotoFile" type="file" accept="image/*" hidden onchange="fotoProduto(this)"></label><img id="prodPhotoPreview" class="th" style="width:76px;height:76px;${p?.photo?"":"display:none"}" src="${p?.photo||""}"><div class="row"><button class="btn g" onclick="saveProduct('${code}')">Salvar cadastro</button><button class="btn o" onclick="md.classList.remove('on')">Cancelar</button></div>`;md.classList.add("on");window.productPhotoDraft=p?.photo||""}
function fotoProduto(el){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const sc=Math.min(1,240/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*sc;c.height=i.height*sc;c.getContext("2d").drawImage(i,0,0,c.width,c.height);window.productPhotoDraft=c.toDataURL("image/jpeg",.65);const imv=$("#prodPhotoPreview");imv.src=window.productPhotoDraft;imv.style.display="block"};i.src=r.result};r.readAsDataURL(f)}
function saveProduct(oldCode){const code=clean($("#prodCode").value)||("X"+Date.now().toString(36).toUpperCase()),name=$("#prodName").value.trim(),brand=$("#prodBrand").value.trim(),qty=$("#prodQty").value.trim();let unit=$("#prodUnit").value,shelf=$("#prodShelf").value;if(unit==="__new__"){unit=prompt("Nova unidade:")||"un";if(!S.customUnits.includes(unit))S.customUnits.push(unit)}if(shelf==="__new__"){shelf=prompt("Nova prateleira:")||"Outros";if(!shelves().includes(shelf))S.customShelves.push(shelf)}if(!name){alert("Informe o nome do produto.");return}const duplicate=S.products.find(x=>x.code===code&&x.code!==oldCode);if(duplicate){alert("Já existe um produto com esse código.");return}const data={code,name,brand,qty,unit,shelf,photo:window.productPhotoDraft||""};if(oldCode){const i=S.products.findIndex(x=>x.code===oldCode);if(i>=0)S.products[i]=data;S.hist.forEach(h=>{if(h.code===oldCode){h.code=code;h.name=name;h.brand=brand;h.qty=qty;h.unit=unit;h.shelf=shelf;h.photo=data.photo}})}else S.products.push(data);save();md.classList.remove("on");p4();p1()}
function deleteProduct(code){if(!confirm("Excluir o cadastro do produto? O histórico de preços será preservado."))return;S.products=S.products.filter(p=>p.code!==code);save();p4()}
function p4(query){const q=(query!==undefined?query:($("#productSearch")?.value||"")).toLowerCase();const arr=S.products.filter(p=>!q||[p.name,p.brand,p.code,p.shelf].join(" ").toLowerCase().includes(q)).sort((a,b)=>a.shelf.localeCompare(b.shelf,"pt-BR")||a.name.localeCompare(b.name,"pt-BR"));$("#p4").innerHTML=`<h1>Produtos</h1><div class="c"><input class="f" id="productSearch" placeholder="Buscar por nome, marca ou código" value="${q}" oninput="p4(this.value)"><button class="btn g" onclick="productForm()">＋ Cadastrar produto</button></div>${arr.map(p=>`<div class="c"><div class="li">${im(p.photo)}<span><b>${p.name}</b><small>${p.brand||"Sem marca"} · ${p.qty||""}${p.unit||""}<br>${p.shelf||"Outros"} · Cód. ${p.code}</small></span></div><div class="row"><button class="btn o" onclick="productForm('${p.code}')">Editar</button><button class="btn o" onclick="deleteProduct('${p.code}')">Excluir</button></div></div>`).join("")||'<div class="c mut">Nenhum produto cadastrado. Comece adicionando o primeiro.</div>'}`}
function p5(){const groups=[...new Set(S.hist.map(h=>h.code))].filter(Boolean);$("#p5").innerHTML=`<h1>Análises</h1><div class="c"><label class="mut">Selecione um produto para consultar seu histórico</label><select class="f" id="analysisProduct" onchange="showAnalysis(this.value)"><option value="">Escolha um produto</option>${S.products.map(p=>`<option value="${p.code}">${p.name} · ${p.brand||""}</option>`).join("")}</select><div id="analysisResult" class="mut">A análise exibirá histórico, menor preço, média e gráfico.</div></div>`}
function chartProduct(code){cur=S.hist.filter(h=>h.code===code);if(cur.length)chart()}
function showAnalysis(code){const p=productByCode(code),l=S.hist.filter(h=>h.code===code).sort((a,b)=>a.date.localeCompare(b.date));const el=$("#analysisResult");if(!p||!l.length){el.innerHTML="Ainda não há registros de preço para este produto.";return}const vals=l.map(x=>x.price),avg=vals.reduce((a,b)=>a+b,0)/vals.length,min=Math.min(...vals),max=Math.max(...vals),last=l[l.length-1],prev=l.length>1?l[l.length-2]:null,diff=prev?((last.price-prev.price)/prev.price*100):null;el.innerHTML=`<div class="stat">Menor preço: <b>${R(min)}</b><br>Maior preço: <b>${R(max)}</b><br>Média geral: <b>${R(avg)}</b><br>Último registro: <b>${R(last.price)}</b> em ${fd(last.date)}${diff===null?"":`<br>Variação vs. registro anterior: <b style="color:${diff>0?"var(--red)":diff<0?"var(--grn)":"var(--mut)"}">${diff>0?"+":""}${diff.toFixed(1).replace(".",",")}%</b>`}</div>${l.map(h=>`<div class="li"><span>${fd(h.date)} · ${h.market||"Mercado não informado"}</span><b>${R(h.price)}</b></div>`).join("")}<button class="btn o" onclick="chartProduct('${code}')">Ver gráfico</button>`}
function addMarket(){const name=$("#newMarket").value.trim(),city=$("#newCity").value.trim();if(!name){alert("Informe o nome do mercado.");return}let m=S.markets.find(x=>x.name.toLowerCase()===name.toLowerCase()&&(x.city||"").toLowerCase()===city.toLowerCase());if(!m){m={name,city};S.markets.push(m)}S.market=m.name;S.city=m.city;regMarket=m.name+"|"+(m.city||"");save();updateHeader();p0();p1()}
function p2(){const t=S.cart.reduce((a,i)=>a+i.price*i.q,0);
$("#p2").innerHTML=`<h1>Carrinho 🛒</h1><div class="c">${S.cart.map((i,n)=>`<div class="li">${im(i.photo)}<span>${i.name} <small>${i.brand} ${i.qty}${i.unit}</small></span><button class="chip" onclick="S.cart[${n}].q=Math.max(1,S.cart[${n}].q-1);save();p2()">−</button><b>${i.q}</b><button class="chip" onclick="S.cart[${n}].q++;save();p2()">+</button><small>${R(i.price*i.q)}</small></div>`).join("")||'<div class="mut">Carrinho vazio. Use “Salvar + carrinho” ao registrar.</div>'}</div>
<div>Total: <span class="tot">${R(t)}</span></div><button class="btn o" onclick="S.cart=[];save();p2()">Esvaziar carrinho</button><div class="c"><b>Adicionar produtos registrados hoje</b><div class="mut">${S.hist.filter(h=>h.date===T).length} registros encontrados</div>${S.hist.filter(h=>h.date===T).slice().reverse().map((h,n)=>`<div class="li"><span>${h.name} <small>${h.brand||""} · ${R(h.price)} · ${h.market||"Mercado não informado"}</small></span><button class="chip" onclick="addHistoryToCart(${S.hist.indexOf(h)})">＋</button></div>`).join("")||'<div class="mut">Nenhum produto registrado hoje.</div>'}</div>${listMarkup("cart")}`}
function addHistoryToCart(i){const h=S.hist[i];if(!h)return;const existing=S.cart.find(x=>x.code===h.code&&x.date===h.date&&x.market===h.market);if(existing)existing.q=(existing.q||1)+1;else S.cart.push({...h,q:1});save();p2()}
function p3(){const hs=S.hist.filter(h=>(!F.mk||h.market===F.mk)&&(!F.q||h.name.toLowerCase().includes(F.q.toLowerCase()))&&(!F.mo||h.date.startsWith(F.mo))).reverse();
const pr=prods().filter(p=>F.shelf==="Todos"||p.shelf===F.shelf),mks=[...new Set(S.hist.map(h=>h.market).filter(Boolean))];
$("#p3").innerHTML=`<h1>Eu</h1><div class="c"><b>⚙️ Configurações</b>
<input class="f" placeholder="Seu nome" value="${S.user}" onchange="S.user=this.value;save();p0()">
<input class="f" placeholder="Compartilhar com (e-mail)" disabled title="Requer servidor">
<div class="row"><select class="f" onchange="S.theme=this.value;save();updateHeader()"><option value="auto">Tema auto</option><option value="light" ${S.theme=="light"?"selected":""}>Claro</option><option value="dark" ${S.theme=="dark"?"selected":""}>Escuro</option></select>
<select class="f" onchange="S.fs=+this.value;save();updateHeader()">${[14,16,19].map(x=>`<option value="${x}" ${S.fs==x?"selected":""}>Fonte ${x}</option>`).join("")}</select></div><div class="row"><button class="btn g" onclick="exportBackup()">Baixar backup dos dados</button><label class="btn o" style="text-align:center;cursor:pointer">Restaurar backup<input type="file" accept="application/json,.json" hidden onchange="importBackup(this)"></label></div><small class="mut">O backup inclui histórico, carrinho, mercados, configurações e fotos.</small></div>
<div class="c"><b>📜 Histórico</b><div class="row"><input class="f" placeholder="Item" value="${F.q}" onchange="F.q=this.value;p3()"><input class="f" type="month" value="${F.mo}" onchange="F.mo=this.value;p3()"></div>
<select class="f" onchange="F.mk=this.value;p3()"><option value="">Todos os mercados</option>${mks.map(m=>`<option ${F.mk==m?"selected":""}>${m}</option>`).join("")}</select>
${hs.slice(0,30).map(h=>`<div class="li">${im(h.photo)}<span>${h.name} <small>${h.brand} ${h.qty}${h.unit}<br>${h.market||"?"} · ${h.date.split("-").reverse().join("/")}</small></span><b>${R(h.price)}${up(h)?`<br><small>${U(up(h))}</small>`:""}</b></div>`).join("")||'<div class="mut">Nenhum registro.</div>'}
<button class="btn g" onclick="csv()">Copiar CSV</button><a class="btn o" style="display:block;text-align:center;text-decoration:none;margin-top:6px" target="_blank" href="https://docs.google.com/spreadsheets/create">Abrir Google Sheets e colar</a></div>
`}
function exportBackup(){
const data=JSON.stringify({format:"suupaa-backup",version:1,exportedAt:new Date().toISOString(),data:S});
const blob=new Blob([data],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
const d=new Date(),stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
a.href=url;a.download="suupaa-backup-"+stamp+".json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function importBackup(el){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result),data=parsed.data||parsed;if(!data||!Array.isArray(data.hist)||!Array.isArray(data.cart))throw new Error("Arquivo não parece ser um backup válido do Suupaa.");if(!confirm("Restaurar este backup? Os dados atuais deste navegador serão substituídos pelos dados do arquivo."))return;S={...S,...data};save();alert("Backup restaurado! O aplicativo será atualizado.");location.reload()}catch(e){alert(e.message||"Não foi possível ler o backup.")}};r.readAsText(f);el.value=""}
function csv(){const c="data;mercado;cidade;codigo;item;marca;qtd;unidade;prateleira;preco\n"+S.hist.map(h=>[h.date,h.market,h.city,h.code,h.name,h.brand,h.qty,h.unit,h.shelf,h.price].join(";")).join("\n");
navigator.clipboard.writeText(c).then(()=>alert("CSV copiado! Cole no Google Sheets."),()=>alert("Não foi possível copiar."))}
const tabs=[["🏠","Início"],["📷","Registrar"],["🥕","Produtos"],["🛒","Carrinho"],["📊","Análises"],["👤","Eu"]];
$("#nv").innerHTML=tabs.map((t,i)=>`<button onclick="go(${i})"><i>${t[0]}</i>${t[1]}</button>`).join("");
const tr=$("#tr");function go(i){tr.scrollTo({left:i*tr.clientWidth,behavior:"smooth"})}
tr.onscroll=()=>{const i=Math.round(tr.scrollLeft/tr.clientWidth);document.querySelectorAll("#nv button").forEach((b,j)=>b.classList.toggle("on",i==j));document.querySelectorAll("section").forEach((s,j)=>s.classList.toggle("off",i!=j))};
updateHeader();p0();p1();p4();p2();p5();p3();tr.onscroll();
</script></body></html>
