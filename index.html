<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Suupaa スーパー</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6E7B4;--card:#FFFBEA;--ink:#2B2118;--mut:#7a6a55;--red:#D6402B;--grn:#2F7D4F;--ylw:#F2B632;--line:#e3d29a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a14;--card:#2a251b;--ink:#f6e7b4;--mut:#b9a982;--line:#463d28}}
:root[data-theme="dark"]{--bg:#1d1a14;--card:#2a251b;--ink:#f6e7b4;--mut:#b9a982;--line:#463d28}
html,body{height:100%;margin:0}*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;font-size:var(--fs,16px);display:flex;flex-direction:column;overflow:hidden}
.awn{height:26px;flex:none;background:repeating-linear-gradient(90deg,var(--red) 0 28px,#fff7dc 28px 56px);position:relative;margin-bottom:10px}
.awn:after{content:"";position:absolute;left:0;right:0;top:100%;height:10px;background:radial-gradient(circle at 14px 0,var(--red) 13px,transparent 14px) 0 0/56px 10px,radial-gradient(circle at 42px 0,#fff7dc 13px,transparent 14px) 0 0/56px 10px}
.bar{display:flex;gap:8px;padding:6px 14px 8px;font-size:.78em;color:var(--mut);align-items:center;flex-wrap:wrap}
.bar b{color:var(--ink)}.header-market{border:0;background:transparent;color:var(--ink);font:inherit;padding:0;text-decoration:underline;text-underline-offset:3px}.bar input{font:inherit;font-size:1em;border:0;background:transparent;color:var(--mut);width:118px}
.track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.track::-webkit-scrollbar{display:none}
section{flex:none;width:100%;scroll-snap-align:center;overflow-y:auto;padding:6px 16px 20px;transition:transform .3s,opacity .3s}
section.off{transform:scale(.93);opacity:.55}
h1{font-size:1.7em;line-height:1.1;margin:4px 0 6px}h2{font-size:1.15em;margin:16px 0 8px}
.c{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin:10px 0}
input,select,button{font:inherit;color:var(--ink)}
.f{width:100%;min-width:0;max-width:100%;padding:9px 11px;border:2px solid var(--line);border-radius:12px;background:var(--card);margin:3px 0}
.reg-meta{align-items:flex-end;gap:8px}.reg-meta .f{font-size:14px;padding:8px 5px}#regDate{display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%;padding:8px 6px;font-size:14px;appearance:auto}#regDate::-webkit-date-and-time-value{min-width:0;text-align:left}#regDate::-webkit-calendar-picker-indicator{margin:0;padding:0 2px} .c{min-width:0;max-width:100%;overflow:hidden}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{background:var(--red);color:#fff;border:0;border-radius:14px;padding:11px 14px;font-weight:600;cursor:pointer;width:100%;margin-top:6px}
.btn.g{background:var(--grn)}.btn.o{background:transparent;color:var(--ink);border:2px solid var(--line)}
.li{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px dashed var(--line);transition:all .35s}
.li.gone{opacity:0;transform:translateX(40px);height:0;padding:0;overflow:hidden}
.li input{width:22px;height:22px;accent-color:var(--grn)}.li span{flex:1}.li small,.mut{color:var(--mut)}.li small{display:block;margin-top:2px}
.stat{background:var(--ylw);color:#2B2118;border-radius:14px;padding:10px 12px;margin-top:10px;cursor:pointer;font-size:.9em}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0}.chip{flex:none;padding:6px 12px;border-radius:99px;border:2px solid var(--line);background:var(--card);cursor:pointer}.chip.on{background:var(--grn);color:#fff;border-color:var(--grn)}
nav{flex:none;display:flex;justify-content:space-around;background:var(--card);border-top:3px solid var(--line);padding:6px 4px 8px}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;font-size:.65em;color:var(--mut);cursor:pointer;gap:2px;padding:4px 5px;border-radius:12px;min-width:0}
nav button i{font-style:normal;font-size:1.55em}nav button.on{color:var(--ink);background:var(--ylw)}
.mod{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9;padding:20px}.mod.on{display:flex}
.mod div{background:var(--card);border-radius:20px;padding:16px;width:100%;max-width:420px}
@media(max-width:600px){.mod.product-editor{padding:0;align-items:stretch}.mod.product-editor>div{width:100%;height:100%;max-width:none;border-radius:0;overflow-y:auto;padding:18px 16px calc(26px + env(safe-area-inset-bottom))}}
@media(min-width:601px){.mod.product-editor>div{max-width:620px;max-height:92vh;overflow-y:auto}}
#prodScannerBox{background:#171717;color:#fff;border-radius:18px;padding:12px;margin:10px 0}#prodScannerBox video{width:100%;height:54vh;max-height:560px;min-height:280px;object-fit:contain;background:#000;border-radius:12px}#prodScannerBox .scan-hint{color:#fff;text-align:center;font-size:.9em;padding:8px 4px}
#prodNotes{min-height:105px;resize:vertical}
.th{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none;background:var(--line);display:flex;align-items:center;justify-content:center}
#ph{width:64px;height:64px;object-fit:cover;margin:3px 0}.list-box summary{cursor:pointer;font-weight:600;padding:2px}.list-box summary small{font-weight:400;color:var(--mut)}.list-box[open] summary{margin-bottom:8px}
.tot{font-size:1.6em;font-weight:600;color:var(--red)}
.home-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}
.home-action{aspect-ratio:1/1;min-width:0;border:2px solid var(--line);border-radius:22px;background:var(--card);color:var(--ink);padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.home-action:active{transform:translateY(2px);box-shadow:none}
.home-action .home-icon{height:54px;display:flex;align-items:center;justify-content:center;color:var(--red)}
.home-action strong{font-size:1.05em;line-height:1.2}
.home-action small{color:var(--mut);font-size:.78em}
@media(max-width:390px){nav button{padding:4px 2px;font-size:.59em}nav button i{font-size:1.4em}}
</style></head><body>
<div class="awn"></div>
<div class="track" id="tr">
<section id="p0"></section><section id="p1"></section><section id="p4"></section><section id="p3"></section>
</div>
<nav id="nv"></nav>
<div class="mod" id="md"><div id="mb"></div></div>
<script>
const $=s=>document.querySelector(s),R=v=>"R$ "+(+v||0).toFixed(2).replace(".",","),T=(()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")})();
let S={user:"",market:"",city:"",markets:[],customShelves:[],customUnits:[],theme:"auto",fs:16,hist:[],list:[],cart:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem("suupaa")||"{}"))}catch(e){}
S.markets=Array.isArray(S.markets)?S.markets:[];S.customShelves=Array.isArray(S.customShelves)?S.customShelves:[];S.customUnits=Array.isArray(S.customUnits)?S.customUnits:[];S.hist=Array.isArray(S.hist)?S.hist:[];S.list=Array.isArray(S.list)?S.list:[];S.cart=Array.isArray(S.cart)?S.cart:[];
S.products=Array.isArray(S.products)?S.products:[];
const clean=s=>String(s||"").replace(/[^A-Za-z0-9]/g,"").slice(0,20);
// Migração local: cada produto antigo do histórico passa a compor o catálogo, sem apagar registros.
for(const h of S.hist){const code=clean(String(h.code||""));if(!S.products.some(p=>p.code===code&&code)){S.products.push({code:code||("LEG"+S.products.length),name:h.name||"",brand:h.brand||"",qty:h.qty||"",unit:h.unit||"un",shelf:h.shelf||"Outros",photo:h.photo||""})}}
if(S.market&&!S.markets.some(m=>m.name===S.market&&m.city===(S.city||"")))S.markets.push({name:S.market,city:S.city||""});
let storageWarningShown=false;
const save=()=>{try{localStorage.setItem("suupaa",JSON.stringify(S));return true}catch(e){if(!storageWarningShown){storageWarningShown=true;alert("Não foi possível salvar os dados neste navegador. O armazenamento pode estar cheio (principalmente por causa das fotos). Faça um backup em Eu > Backup dos dados e reduza/remova fotos grandes.")}return false}};
let date=T,regDate=T,regMarket="",F={shelf:"Todos",mk:"",q:"",mo:"",from:"",to:"",all:true},cur={};
const SH=["Hortifruti","Frios","Padaria","Açougue","Congelados","Geladeira","Limpeza","Higiene","Bebidas","Snacks","Grãos e farinhas","Outros"];
const shelves=()=>[...SH,...S.customShelves.filter(x=>!SH.includes(x))];
const units=()=>["g","kg","ml","L","un","rolo","m","folha",...S.customUnits.filter(x=>!["g","kg","ml","L","un","rolo","m","folha"].includes(x))];
const im=p=>p?`<img class="th" src="${p}" alt="Foto do produto">`:'<div class="th">🧺</div>';
const M={g:[1000,"kg"],ml:[1000,"L"]},lab=u=>(M[u]||[1,u])[1],fd=d=>(d||"").split("-").reverse().join("/");
const up=h=>{const q=Number(h.qty),price=Number(h.price);if(!q||!price)return null;return{v:price/q*(M[h.unit]||[1])[0],l:lab(h.unit)}};
const U=o=>o?R(o.v)+"/"+o.l:"";
const md=$("#md");
let scannerStream=null,scannerTimer=null,scannerReader=null,scannerActive=false;

const prods=()=>{const m={};S.hist.forEach(h=>m[h.code]=h);return Object.values(m)};
const find=(code,name)=>S.hist.filter(h=>code?h.code===code:name&&h.name.toLowerCase()===name.toLowerCase());
const last=t=>{const l=S.hist.filter(h=>h.name.toLowerCase().includes(t.toLowerCase()));return l.length?l[l.length-1]:null};
function updateHeader(){
document.documentElement.dataset.theme=S.theme;
document.documentElement.style.setProperty("--fs",S.fs+"px");
}
const long=new Date().toLocaleDateString("pt-BR",{day:"numeric",month:"long",year:"numeric"});
function marketOptions(){return S.markets.map((m,i)=>`<option value="${i}" ${m.name===S.market&&m.city===(S.city||"")?"selected":""}>${m.name}${m.city?" · "+m.city:""}</option>`).join("")}
function chooseMarket(i){const m=S.markets[+i];if(!m)return;S.market=m.name;S.city=m.city||"";save();p0()}
function showChart(code){
const l=S.hist.filter(h=>h.code===code).slice().sort((a,b)=>a.date.localeCompare(b.date));
if(!l.length)return;
const mx=Math.max(...l.map(h=>Number(h.price))),mn=Math.min(...l.map(h=>Number(h.price))),range=mx-mn||1;
const pts=l.map((h,i)=>[30+i*(280/Math.max(l.length-1,1)),105-((Number(h.price)-mn)/range)*78]);
const labels=l.map(h=>fd(h.date));
$("#mb").innerHTML=`<b>${l[0].name} · histórico de preços</b>
<svg viewBox="0 0 340 180" style="width:100%;height:auto;display:block" role="img" aria-label="Gráfico de preços com datas">
<line x1="24" y1="112" x2="318" y2="112" stroke="var(--line)" stroke-width="1"/>
<polyline fill="none" stroke="var(--red)" stroke-width="3" points="${pts.map(p=>p.join(",")).join(" ")}"/>
${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--grn)"/><text x="${p[0]}" y="${p[1]-8}" font-size="9" text-anchor="middle" fill="var(--ink)">${Number(l[i].price).toFixed(2).replace(".",",")}</text><text x="${p[0]}" y="130" font-size="8" text-anchor="end" transform="rotate(-35 ${p[0]} 130)" fill="var(--mut)">${labels[i]}</text>`).join("")}
</svg><button class="btn o" onclick="md.classList.remove('on')">Fechar</button>`;
md.classList.add("on")
}
function addMarket(){const name=$("#newMarket").value.trim(),city=$("#newCity").value.trim();if(!name){alert("Informe o nome do mercado.");return}let m=S.markets.find(x=>x.name.toLowerCase()===name.toLowerCase()&&(x.city||"").toLowerCase()===city.toLowerCase());if(!m){m={name,city};S.markets.push(m)}S.market=m.name;S.city=m.city;regMarket=m.name+"|"+(m.city||"");save();p1()}
function listMarkup(where){const pending=S.list.filter(i=>!i.done);return `<details class="c list-box"><summary>🧺 Lista de compras <small>(${pending.length} ${pending.length===1?"item":"itens"})</small></summary><div id="ls-${where}">${S.list.map((i,n)=>`<div class="li ${i.done?"gone":""}"><input type="checkbox" ${i.done?"checked":""} onchange="tick(${n},this)"><span>${i.t}</span><small>${last(i.t)?R(last(i.t).price):""}</small></div>`).join("")||'<div class="mut">Lista vazia. Adicione o primeiro item.</div>'}</div><div class="row"><input class="f" id="ni-${where}" placeholder="Novo item"><button class="btn" style="flex:none;width:auto" onclick="addL('${where}')">+</button></div></details>`}
function p0(){const h=new Date().getHours(),g=h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";
$("#p0").innerHTML=`<h1>${g}, ${S.user||"feirante"}!</h1><div class="mut">Hoje é dia ${long}.</div>
<div class="home-actions">
<button class="home-action" onclick="go(1)"><span class="home-icon"><svg width="58" height="58" viewBox="0 0 58 58" aria-hidden="true"><path d="M8 8v42M13 8v42M19 8v42M24 8v42M33 8v42M38 8v42M45 8v42M50 8v42" stroke="currentColor" stroke-width="2.6"/><path d="M4 4h50v50H4z" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".25"/></svg></span><strong>Registrar um item</strong><small>Pesquisar produto e lançar preço</small></button>
<button class="home-action" onclick="go(2)"><span class="home-icon"><svg width="58" height="58" viewBox="0 0 58 58" fill="none" aria-hidden="true"><path d="M8 16h42v34H8z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M18 16V9h22v7M18 32h22M29 22v20" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M23 27l6-6 6 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><strong>Cadastrar novo produto</strong><small>Adicionar item ao catálogo</small></button>
</div>`}
function tick(n,el){S.list[n].done=true;el.parentNode.classList.add("gone");setTimeout(()=>{S.list=S.list.filter(i=>!i.done);save();p0()},380);save()}
function addL(where){const v=$("#ni-"+where).value.trim();if(v){S.list.push({t:v,done:false});save();p0()}}
function productByCode(code){return S.products.find(p=>String(p.code||"")===String(clean(code)))}
function productNameMatches(q){q=(q||"").trim().toLowerCase();return S.products.filter(p=>!q||p.name.toLowerCase().includes(q)||String(p.code).includes(q)||String(p.brand||"").toLowerCase().includes(q))}
function p1(){
 const opts=S.products.slice().sort((a,b)=>a.name.localeCompare(b.name,"pt-BR"));
 $("#p1").innerHTML=`<h1>Registrar preço</h1>
 <div class="c"><b>1. Encontre o produto</b>
 <div class="row"><input class="f" id="regSearch" placeholder="Código de barras ou nome do produto" oninput="searchRegProducts()"><button class="btn o" type="button" style="flex:none;width:auto;padding:10px 13px" onclick="clearRegSearch()" aria-label="Limpar busca">✕</button><button class="btn o" type="button" style="flex:none;width:auto" onclick="scan()">▥ Ler código</button></div>
 <div id="regResults" class="mut">Digite o nome ou código, ou use a câmera. Cadastre o produto na aba Produtos se ainda não existir.</div>
 <div id="selectedProduct"></div></div>
 <div class="c"><b>2. Dados da pesquisa</b><label class="mut" for="regPrice">Preço encontrado</label><input class="f" id="regPrice" type="number" step="0.01" min="0.01" placeholder="R$ 0,00" inputmode="decimal">
 <div class="row reg-meta"><div style="flex:1;min-width:0"><label class="mut" for="regMarket">Mercado</label><select class="f" id="regMarket" onchange="setRegMarket(this.value)"><option value="">Selecione</option>${marketOptions()}<option value="__new__">＋ Novo</option></select></div><div style="flex:1;min-width:0"><label class="mut" for="regDate">Data</label><input class="f" id="regDate" type="date" value="${regDate}" onchange="regDate=this.value"></div></div>
 <label class="btn o" style="display:block;text-align:center;cursor:pointer">📸 Foto da etiqueta (opcional)<input type="file" accept="image/*" capture="environment" hidden onchange="fotoRegistro(this)"></label><img id="pricePhoto" class="th" style="display:none;width:76px;height:76px">
 <button class="btn g" onclick="savePrice()">Salvar preço</button><div id="regStatus"></div></div>
 <div class="mut">O cadastro do produto é permanente. Cada pesquisa cria apenas um novo registro de preço.</div>
 <div id="scannerBox" hidden><video id="vd" style="display:block;width:100%;max-height:230px;object-fit:cover;border-radius:14px" playsinline muted></video><button class="btn o" type="button" onclick="stopScan()">Parar leitura</button></div>`;
 const rm=$("#regMarket");if(rm){const ix=S.markets.findIndex(m=>m.name+"|"+(m.city||"")===regMarket);rm.value=ix>=0?String(ix):""}
 if(regSelectedCode)selectProduct(regSelectedCode);
}
let regSelectedCode="",pricePhoto="";
function clearRegSearch(){const input=$("#regSearch");if(input)input.value="";regSelectedCode="";const selected=$("#selectedProduct");if(selected)selected.innerHTML="";const results=$("#regResults");if(results)results.innerHTML="Digite o nome ou código, ou use a câmera. Cadastre o produto na aba Produtos se ainda não existir.";}
function searchRegProducts(){const q=$("#regSearch").value;const found=productNameMatches(q).slice(0,12);$("#regResults").innerHTML=found.map(p=>`<div class="li" onclick="selectProduct('${String(p.code).replace(/'/g,"\\'")}')" style="cursor:pointer">${im(p.photo)}<span><b>${p.name}</b><small>${p.brand||""} · ${p.shelf||""} · ${p.qty||""}${p.unit||""}</small></span><small>Selecionar ›</small></div>`).join("")||'<div class="mut">Nenhum produto encontrado. Cadastre-o na aba Produtos.</div>'}
function selectProduct(code){const p=productByCode(code);if(!p){regSelectedCode="";return}regSelectedCode=p.code;$("#selectedProduct").innerHTML=`<div class="li">${im(p.photo)}<span><b>${p.name}</b><small>${p.brand||""} · ${p.qty||""}${p.unit||""} · ${p.shelf||""}</small></span><button class="chip" onclick="clearSelectedProduct()">Trocar</button></div>`;$("#regResults").innerHTML="Produto selecionado."}
function clearSelectedProduct(){regSelectedCode="";$("#selectedProduct").innerHTML="";searchRegProducts()}
function setRegMarket(v){if(v==="__new__"){const name=prompt("Nome do mercado:");if(!name){p1();return}const city=prompt("Cidade:")||"";let m=S.markets.find(x=>x.name.toLowerCase()===name.trim().toLowerCase()&&(x.city||"").toLowerCase()===city.trim().toLowerCase());if(!m){m={name:name.trim(),city:city.trim()};S.markets.push(m)}regMarket=m.name+"|"+(m.city||"");}else{const m=S.markets[+v];regMarket=m?m.name+"|"+(m.city||""):""}save();const sel=$("#regMarket");if(sel){sel.innerHTML=`<option value="">Selecione o mercado</option>${marketOptions()}<option value="__new__">＋ Novo</option>`;const ix=S.markets.findIndex(m=>m.name+"|"+(m.city||"")===regMarket);sel.value=ix>=0?String(ix):""}}
function fotoRegistro(el){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const sc=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*sc;c.height=i.height*sc;c.getContext("2d").drawImage(i,0,0,c.width,c.height);pricePhoto=c.toDataURL("image/jpeg",.72);const img=$("#pricePhoto");img.src=pricePhoto;img.style.display="block"};i.src=r.result};r.readAsDataURL(f);el.value=""}
function savePrice(){const p=productByCode(regSelectedCode),price=Number($("#regPrice").value);if(!p){alert("Selecione um produto cadastrado antes de salvar o preço.");return}if(!(price>0)){alert("Informe um preço válido.");return}if(!regDate){alert("Informe a data da pesquisa.");return}if(!regMarket){alert("Selecione o mercado da pesquisa.");return}const mk=regMarket.split("|");const v={code:p.code,name:p.name,brand:p.brand,qty:p.qty,unit:p.unit,shelf:p.shelf,price,market:mk[0]||"",city:mk.slice(1).join("|"),date:regDate,photo:p.photo||"",pricePhoto};S.hist.push(v);save();$("#regPrice").value="";pricePhoto="";const img=$("#pricePhoto");img.style.display="none";img.removeAttribute("src");$("#regStatus").innerHTML='<div class="stat">Preço salvo com sucesso!</div>';p3();p4()}
async function loadZXing(){
 if(window.ZXingBrowser?.BrowserMultiFormatReader)return window.ZXingBrowser;
 if(window.ZXing?.BrowserMultiFormatReader)return window.ZXing;
 const sources=[
  "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js",
  "https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"
 ];
 let lastError;
 for(const src of sources){
  try{
   await new Promise((resolve,reject)=>{
    const sc=document.createElement("script");sc.src=src;sc.async=true;
    sc.onload=()=>resolve();sc.onerror=()=>{sc.remove();reject(new Error("Falha ao carregar "+src))};
    document.head.appendChild(sc);
   });
   if(window.ZXingBrowser?.BrowserMultiFormatReader)return window.ZXingBrowser;
   if(window.ZXing?.BrowserMultiFormatReader)return window.ZXing;
   throw new Error("Biblioteca carregada, mas o leitor não foi disponibilizado.");
  }catch(e){lastError=e}
 }
 throw new Error("Não foi possível carregar o leitor. Verifique a conexão com a internet e tente novamente. Se estiver no celular, abra o Suupaa pelo link HTTPS do GitHub Pages.");
}
async function scan(target="reg"){
 const box=target==="product"?$("#prodScannerBox"):$("#scannerBox");let video=target==="product"?$("#prodVd"):$("#vd");if(!box||!video)return;
 try{
  stopScan();
  if(!window.isSecureContext)throw new Error("A câmera exige uma conexão segura. Abra o aplicativo pelo endereço HTTPS do GitHub Pages.");
  if(!navigator.mediaDevices?.getUserMedia)throw new Error("Este navegador não disponibiliza acesso à câmera. Tente abrir o Suupaa no Chrome ou Safari atualizado.");
  if(target==="product"){$("#md").classList.add("product-editor");box.innerHTML='<video id="prodVd" playsinline muted autoplay></video><div class="scan-hint" id="prodScanHint">Aponte a câmera para o código de barras. Mantenha o código inteiro visível e aproxime ou afaste até focar.</div><button class="btn o" type="button" onclick="stopScan()">Fechar leitor e voltar ao cadastro</button>';video=$("#prodVd")}
  box.hidden=false;scannerActive=true;
  scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080},focusMode:{ideal:"continuous"}},audio:false});
  video.srcObject=scannerStream;await video.play();
  const handleCode=(raw)=>{
   const code=clean(raw);if(!code)return;
   stopScan();
   if(target==="product"){
    const input=$("#prodCode");if(input)input.value=code;
    const existing=productByCode(code);const status=$("#prodScanStatus");
    if(status)status.innerHTML=existing?'<div class="stat">Código lido: <b>'+code+'</b>. Este produto já está cadastrado como <b>'+existing.name+'</b>.</div>':'<div class="stat">Código lido com sucesso: <b>'+code+'</b>. Produto novo! Preencha os dados abaixo e salve o cadastro.</div>';
    return;
   }
   const input=$("#regSearch");if(input)input.value="";
   const product=productByCode(code);
   if(product){selectProduct(product.code);}
   else{regSelectedCode="";const selected=$("#selectedProduct");if(selected)selected.innerHTML="";$("#regResults").innerHTML='<div class="stat">Código lido: <b>'+code+'</b>. Produto ainda não cadastrado. Cadastre-o na aba Produtos.</div>';}
  };
  if("BarcodeDetector" in window){
   let detector;try{detector=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39","itf"]})}catch{detector=new BarcodeDetector()}
   const tick=async()=>{if(!scannerActive)return;try{const codes=await detector.detect(video);if(codes?.length){handleCode(codes[0].rawValue);return}}catch(e){const hint=$("#prodScanHint");if(hint)hint.textContent="Não consegui analisar esta imagem. Ajuste a distância e mantenha o código bem iluminado."}scannerTimer=setTimeout(tick,220)};tick();return;
  }
  const ZX=await loadZXing();const Reader=ZX?.BrowserMultiFormatReader;if(!Reader)throw new Error("Leitor não disponível neste navegador.");
  scannerReader=new Reader();
  await scannerReader.decodeFromVideoDevice(undefined,video,(result,err)=>{if(result)handleCode(result.getText())});
 }catch(e){stopScan();alert(e.message||"Não foi possível acessar a câmera. Confira a permissão do navegador e tente novamente.")}
}
function stopScan(){scannerActive=false;if(scannerTimer){clearTimeout(scannerTimer);scannerTimer=null}if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null}if(scannerReader){try{scannerReader.reset()}catch(e){}scannerReader=null}["#vd","#prodVd"].forEach(sel=>{const v=$(sel);if(v){v.pause?.();v.srcObject=null}});["#scannerBox","#prodScannerBox"].forEach(sel=>{const b=$(sel);if(b)b.hidden=true})}
function escHTML(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function productForm(code=""){
 stopScan();const p=code?productByCode(code):null;$("#md").classList.add("product-editor");
 $("#mb").innerHTML=`<h2>${p?"Editar produto":"Cadastrar produto"}</h2><label class="mut">Código de barras (opcional)</label><div class="row"><input class="f" id="prodCode" value="${escHTML(p?.code||"")}" placeholder="Código de barras"><button class="btn o" type="button" style="flex:none;width:auto;margin:3px 0" onclick="scan('product')">▥ Escanear código</button></div><div id="prodScanStatus"></div><div id="prodScannerBox" hidden><video id="prodVd" playsinline muted autoplay></video><div class="scan-hint" id="prodScanHint">Aponte para o código de barras.</div><button class="btn o" type="button" onclick="stopScan()">Fechar leitor e voltar ao cadastro</button></div><label class="mut">Nome</label><input class="f" id="prodName" value="${escHTML(p?.name||"")}" placeholder="Nome do produto"><label class="mut">Marca</label><input class="f" id="prodBrand" value="${escHTML(p?.brand||"")}" placeholder="Marca"><div class="row"><div><label class="mut">Quantidade</label><input class="f" id="prodQty" value="${escHTML(p?.qty||"")}" placeholder="Ex.: 500"></div><div><label class="mut">Unidade</label><select class="f" id="prodUnit">${units().map(u=>`<option ${u===(p?.unit||"un")?"selected":""}>${u}</option>`).join("")}<option value="__new__">＋ Nova</option></select></div></div><label class="mut">Prateleira</label><select class="f" id="prodShelf">${shelves().map(x=>`<option ${x===(p?.shelf||"Outros")?"selected":""}>${x}</option>`).join("")}<option value="__new__">＋ Nova</option></select><label class="mut">Observações</label><textarea class="f" id="prodNotes" placeholder="Anote detalhes, links, referências ou qualquer informação sobre o produto...">${escHTML(p?.notes||"")}</textarea><label class="btn o" style="display:block;text-align:center">📸 Foto do produto<input id="prodPhotoFile" type="file" accept="image/*" hidden onchange="fotoProduto(this)"></label><img id="prodPhotoPreview" class="th" style="width:76px;height:76px;${p?.photo?"":"display:none"}" src="${p?.photo||""}"><div class="row"><button class="btn g" onclick="saveProduct('${code}')">Salvar cadastro</button><button class="btn o" onclick="closeProductForm()">Cancelar</button></div>`;
 $("#md").classList.add("on");window.productPhotoDraft=p?.photo||"";
}
function closeProductForm(){stopScan();$("#md").classList.remove("on","product-editor")}

function fotoProduto(el){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const sc=Math.min(1,240/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*sc;c.height=i.height*sc;c.getContext("2d").drawImage(i,0,0,c.width,c.height);window.productPhotoDraft=c.toDataURL("image/jpeg",.65);const imv=$("#prodPhotoPreview");imv.src=window.productPhotoDraft;imv.style.display="block"};i.src=r.result};r.readAsDataURL(f)}
function saveProduct(oldCode){const code=clean($("#prodCode").value)||("X"+Date.now().toString(36).toUpperCase()),name=$("#prodName").value.trim(),brand=$("#prodBrand").value.trim(),qty=$("#prodQty").value.trim();let unit=$("#prodUnit").value,shelf=$("#prodShelf").value;if(unit==="__new__"){unit=prompt("Nova unidade:")||"un";if(!S.customUnits.includes(unit))S.customUnits.push(unit)}if(shelf==="__new__"){shelf=prompt("Nova prateleira:")||"Outros";if(!shelves().includes(shelf))S.customShelves.push(shelf)}if(!name){alert("Informe o nome do produto.");return}const duplicate=S.products.find(x=>x.code===code&&x.code!==oldCode);if(duplicate){alert("Já existe um produto com esse código.");return}const data={code,name,brand,qty,unit,shelf,photo:window.productPhotoDraft||"",notes:$("#prodNotes")?.value.trim()||""};if(oldCode){const i=S.products.findIndex(x=>x.code===oldCode);if(i>=0)S.products[i]=data;S.hist.forEach(h=>{if(h.code===oldCode){h.code=code;h.name=name;h.brand=brand;h.qty=qty;h.unit=unit;h.shelf=shelf;h.photo=data.photo}})}else S.products.push(data);save();closeProductForm();p4();p1()}
function deleteProduct(code){if(!confirm("Excluir o cadastro do produto? O histórico de preços será preservado."))return;S.products=S.products.filter(p=>p.code!==code);save();p4()}
function p4(query){const q=String(query!==undefined?query:($("#productSearch")?.value||"")).toLowerCase();const arr=S.products.filter(p=>!q||[p.name,p.brand,p.code,p.shelf].join(" ").toLowerCase().includes(q)).sort((a,b)=>String(a.shelf||"").localeCompare(String(b.shelf||""),"pt-BR")||a.name.localeCompare(b.name,"pt-BR"));$("#p4").innerHTML=`<h1>Produtos</h1><div class="c"><input class="f" id="productSearch" placeholder="Buscar por nome, marca ou código" value="${q}" oninput="p4(this.value)"><button class="btn g" onclick="productForm()">＋ Cadastrar produto</button></div>${arr.map(p=>`<div class="c"><div class="li">${im(p.photo)}<span><b>${p.name}</b><small>${p.brand||"Sem marca"} · ${p.qty||""}${p.unit||""}<br>${p.shelf||"Outros"} · Cód. ${p.code}</small></span></div><button class="btn o" aria-expanded="false" onclick="showProductMiniAnalysis('${p.code}')">Ver preços e histórico <span aria-hidden="true">▾</span></button><div id="mini-${encodeURIComponent(p.code)}" hidden></div><div class="row"><button class="btn o" onclick="productForm('${p.code}')">Editar</button><button class="btn o" onclick="deleteProduct('${p.code}')">Excluir</button></div></div>`).join("")||'<div class="c mut">Nenhum produto cadastrado. Comece adicionando o primeiro.</div>'}`;if(query!==undefined){const inp=$("#productSearch");inp?.focus();inp?.setSelectionRange?.(inp.value.length,inp.value.length)}}
function showProductMiniAnalysis(code){const el=document.getElementById("mini-"+encodeURIComponent(code));if(!el)return;const toggle=el.previousElementSibling;if(!el.hidden){el.hidden=true;if(toggle){toggle.innerHTML='Ver preços e histórico <span aria-hidden="true">▾</span>';toggle.setAttribute("aria-expanded","false")}return}el.hidden=false;if(toggle){toggle.innerHTML='Ver preços e histórico <span aria-hidden="true">▴</span>';toggle.setAttribute("aria-expanded","true")}const records=S.hist.filter(h=>String(h.code)===String(code)).sort((a,b)=>(b.date||"").localeCompare(a.date||""));if(!records.length){el.innerHTML='<div class="stat">Ainda não há preços registrados para este produto.</div>';return}const now=T.slice(0,7),month=records.filter(h=>(h.date||"").slice(0,7)===now),avg=month.length?month.reduce((a,h)=>a+(Number(h.price)||0),0)/month.length:null,lowest=records.slice().sort((a,b)=>(Number(a.price)||0)-(Number(b.price)||0)).slice(0,3),recent=records.slice(0,5);el.innerHTML=`<div class="c" style="margin-top:8px"><h2 style="margin-top:2px">Resumo de preços</h2><div class="stat"><b>3 menores preços registrados</b>${lowest.map((h,i)=>`<div class="li"><span>${i+1}º · ${h.market||"Mercado não informado"}<small> · ${fd(h.date)}${h.city?" · "+h.city:""}</small></span><b>${R(h.price)}</b></div>`).join("")}</div><div class="stat"><b>Média deste mês</b><br>${avg===null?"Nenhum registro neste mês":R(avg)+` <small>(${month.length} ${month.length===1?"registro":"registros"})</small>`}</div><h2>Últimos registros</h2>${recent.map(h=>`<div class="li"><span>${h.market||"Mercado não informado"}<small> · ${fd(h.date)}${h.city?" · "+h.city:""}</small></span><b>${R(h.price)}</b></div>`).join("")}<button class="btn o" onclick="showChart('${code}')">Ver gráfico de preços</button></div>`}


function addMarket(){const name=$("#newMarket").value.trim(),city=$("#newCity").value.trim();if(!name){alert("Informe o nome do mercado.");return}let m=S.markets.find(x=>x.name.toLowerCase()===name.toLowerCase()&&(x.city||"").toLowerCase()===city.toLowerCase());if(!m){m={name,city};S.markets.push(m)}S.market=m.name;S.city=m.city;regMarket=m.name+"|"+(m.city||"");save();p1()}

function historyFiltered(){
return S.hist.filter(h=>(!F.mk||h.market===F.mk)&&(F.all||((!F.from||h.date>=F.from)&&(!F.to||h.date<=F.to)))).sort((a,b)=>b.date.localeCompare(a.date));
}
function p3(){
const mks=[...new Set(S.hist.map(h=>h.market).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
$("#p3").innerHTML=`<h1>Histórico</h1>
<div class="c"><b>Filtrar registros</b>
<label class="mut" for="histMarket">Mercado</label>
<select class="f" id="histMarket" onchange="F.mk=this.value;p3()"><option value="">Todos os mercados</option>${mks.map(m=>`<option value="${m.replace(/&/g,"&amp;").replace(/"/g,"&quot;")}" ${F.mk===m?"selected":""}>${m}</option>`).join("")}</select>

<div class="row"><div><small class="mut">De</small><input class="f" type="date" value="${F.from||""}" ${F.all?"disabled":""} onchange="F.from=this.value;p3()"></div><div><small class="mut">Até</small><input class="f" type="date" value="${F.to||""}" ${F.all?"disabled":""} onchange="F.to=this.value;p3()"></div></div>
<label class="li" style="border:0"><input type="checkbox" ${F.all?"checked":""} onchange="F.all=this.checked;if(F.all){F.from='';F.to=''}p3()"><span>Todos os períodos</span></label>
<div class="mut" style="margin:8px 0">${historyFiltered().length} registro(s) encontrados</div>
<button class="btn g" onclick="csv()">Baixar CSV</button>
</div>
<div class="c"><b>Prévia do histórico</b>${historyFiltered().slice(0,12).map(h=>`<div class="li">${im(h.photo)}<span><b>${h.name||"Produto"}</b><small>${h.market||"Mercado não informado"} · ${h.date.split("-").reverse().join("/")}</small></span><b>${R(h.price)}</b></div>`).join("")||'<div class="mut">Nenhum registro nesse filtro.</div>'}</div>`;
}
function exportBackup(){
const data=JSON.stringify({format:"suupaa-backup",version:1,exportedAt:new Date().toISOString(),data:S});
const blob=new Blob([data],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
const d=new Date(),stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
a.href=url;a.download="suupaa-backup-"+stamp+".json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);

function importBackup(el){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result),data=parsed.data||parsed;if(!data||!Array.isArray(data.hist))throw new Error("Arquivo não parece ser um backup válido do Suupaa.");if(!confirm("Restaurar este backup? Os dados atuais deste navegador serão substituídos pelos dados do arquivo."))return;S={...S,...data};save();alert("Backup restaurado! O aplicativo será atualizado.");location.reload()}catch(e){alert(e.message||"Não foi possível ler o backup.")}};r.readAsText(f);el.value=""}
function csv(){
const rows=historyFiltered();
const fields=["data","mercado","cidade","codigo","item","marca","qtd","unidade","prateleira","preco"];
const quote=v=>{const x=String(v??"");return /[;"\n\r]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};
const content="\uFEFF"+fields.join(";")+"\r\n"+rows.map(h=>[h.date,h.market,h.city,h.code,h.name,h.brand,h.qty,h.unit,h.shelf,h.price].map(quote).join(";")).join("\r\n");
const blob=new Blob([content],{type:"text/csv;charset=utf-8"});
const url=URL.createObjectURL(blob),a=document.createElement("a");
a.href=url;a.download="suupaa-historico.csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

$("#nv").innerHTML=tabs.map((t,i)=>`<button onclick="go(${i})"><i>${t[0]}</i>${t[1]}</button>`).join("");
const tr=$("#tr");function go(i){tr.scrollTo({left:i*tr.clientWidth,behavior:"smooth"})}
tr.onscroll=()=>{const i=Math.round(tr.scrollLeft/tr.clientWidth);document.querySelectorAll("#nv button").forEach((b,j)=>b.classList.toggle("on",i==j));document.querySelectorAll("section").forEach((s,j)=>s.classList.toggle("off",i!=j))};
